<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | The Professor AI</title>
    <style>
        :root {
            --background: #08080E;
            --foreground: #FFFFFF;
            --foreground-muted: #8E929E;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #FFFFFF;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }

        /* Subtle ambient glow behind the card */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .logo-wrapper svg {
            width: 44px;
            height: 44px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: var(--foreground-muted);
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 16px 24px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--foreground);
            color: var(--background);
            border: none;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.05);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--foreground);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--foreground-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 9999px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.01);
        }

        .badge::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #EF4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <div class="badge">Offline Study</div>
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 816">
                <path fill="#ffffff" d="m444 214 39 25 5 2v2l3 1q6 2 11 6l4 3 3 2 10 6 2 1 47 29 2 2 80 50c24 14 24 14 28 25q4 13-3 24l-5 6h-2v2l-4 1v2l-5 3-15 9-2 1-19 13-2 1-2 1q-6 3-12 2-5-3-8-8-2-7 0-12 8-9 20-15l12-8 3-1 3-2 2-1 4-6v-9l-3-1v-2l-2-1q-6-1-10-6l-3-1-25-16-29-18-52-32-45-29-4-2-15-9-17-11-3-1-2-2-4-2-2-2-2-1q-9-4-20-1l-15 8-11 7-2 1-24 15-5 2v2l-3 1-14 9-7 3v2l-2 1-16 10-5 1v2l-40 25-3 2-26 16-11 6-10 7-4 1v2l-2 1-11 7-5 3-5 4v7l1 5 25 16 42 26 2 1 10 7 2 1 11 6v2l2 1 8 5 5 2 13 9 39 23v2l3 1 8 5 5 3 8 5 2 1 13 8 3 2 4 3q13 11 29 9 10-3 17-9l5-3 3-2 7-4 2-2 82-51c11-6 11-6 18-4l7 6q2 7 0 13-9 10-22 16h-2v2l-2 1-30 18-2 1-2 2-2 1-38 23-6 3v2l-2 1-12 7q-17 10-35 8-9-1-16-6v-2h-2q-8-4-17-10l-9-6-4-2-45-29-7-4-13-8-18-11c-8-6-8-6-16-9v97c0 14 0 14 6 26l8 5 9 4a115 115 0 0 0 34 10l19 4h2q38 5 75 5h3q40 1 81-6l4-1 43-11c9-3 21-7 25-16l1-8v-10l1-103 3 3 2 1 5 6 2 3 1 2 2 2q6 9 5 20v63c0 25 0 25-6 34l-1 2q-7 10-18 13v2q-21 11-44 14l-4 2-23 4a386 386 0 0 1-228-20l-3-1q-11-5-18-15v-2h-2q-8-20-5-41v-94c0-6 0-6-3-11l-8-5-23-15-5-2-14-9-16-10q-14-6-20-20-2-13 3-24 9-9 20-16l62-39 21-13 77-47 47-30c23-15 42-19 66-3"/>
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>No internet? No worries. Your study packs are cached locally so you can keep studying without interruption.</p>
        <div class="button-group">
            <button class="btn btn-primary" onclick="retryConnection()">Try Again</button>
            <a href="/library" class="btn btn-secondary">Go to Library</a>
        </div>
    </div>

    <script>
        // Force clean cache-busting reload to bypass Service Worker caching
        function retryConnection() {
            const url = new URL(window.location.href);
            url.searchParams.set('retry', Date.now());
            window.location.href = url.toString();
        }

        // Background auto-connectivity check
        let isReconnecting = false;
        async function runAutoRetry() {
            if (isReconnecting) return;
            try {
                // Fetch a small logo file with a cache buster
                const res = await fetch('/logo.svg?ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                if (res.ok) {
                    isReconnecting = true;
                    
                    // Visual updates to wow the user
                    const desc = document.querySelector('p');
                    if (desc) {
                        desc.innerHTML = "<span style='color: #10B981; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; animation: pulse 1s infinite;'>✓ CONNECTION RESTORED! Re-syncing your study room...</span>";
                    }
                    const badge = document.querySelector('.badge');
                    if (badge) {
                        badge.innerHTML = "Sync Active";
                        badge.style.color = "#10B981";
                        badge.style.borderColor = "rgba(16, 185, 129, 0.2)";
                    }
                    const btn = document.querySelector('.btn-primary');
                    if (btn) {
                        btn.innerHTML = "Reconnecting...";
                        btn.style.backgroundColor = "#10B981";
                        btn.disabled = true;
                    }
                    
                    // Execute auto-reload after a short window for smooth visual feedback
                    setTimeout(retryConnection, 1200);
                }
            } catch (err) {
                // Ping failed, still offline
            }
        }

        // Verify status every 3 seconds
        setInterval(runAutoRetry, 3000);
        // Also listen to browser event for instant wake-up
        window.addEventListener('online', runAutoRetry);
    </script>
</body>
</html>
