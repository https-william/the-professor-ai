    <script>
      // Force Worker Source
      const PDF_WORKER_SRC = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

      window.addEventListener('load', function() {
         const preloader = document.getElementById('preloader-core');
         if(preloader) {
            const root = document.getElementById('root');
            if (root && root.childElementCount > 0) {
               preloader.style.opacity = '0';
               preloader.style.pointerEvents = 'none';
               setTimeout(() => preloader.remove(), 500);
            } else {
               setTimeout(() => {
                   preloader.style.opacity = '0';
                   preloader.style.pointerEvents = 'none';
                   setTimeout(() => preloader.remove(), 500);
               }, 2000);
            }
         }
         
         if (typeof pdfjsLib !== 'undefined') {
             pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
         }
         
         if (typeof mermaid !== 'undefined') {
             mermaid.initialize({ startOnLoad: false, theme: 'dark' });
         }
      });

      // --- THEME ENGINE ---
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'core': 'var(--bg-core)',
              'panel': 'var(--bg-panel)',
              'border-main': 'var(--border-main)',
              'text-pri': 'var(--text-primary)',
              'text-sec': 'var(--text-secondary)',
              'accent': 'var(--accent-main)',
              'accent-dim': 'var(--accent-dim)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Cinzel', 'Merriweather', 'serif'], // Switched to Cinzel to avoid 404
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Cinzel', 'serif'], // Switched to Cinzel
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-in': 'slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'bounce-subtle': 'bounceSubtle 3s infinite ease-in-out',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'progress': 'progress 1s ease-in-out infinite',
              'orbit': 'orbit 3s linear infinite',
              'orbit-reverse': 'orbit-reverse 4s linear infinite',
              'breathe': 'breathe 3s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
              slideUpFade: { '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
              bounceSubtle: { '0%, 100%': { transform: 'translateY(-5%)' }, '50%': { transform: 'translateY(0)' } },
              shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
              progress: { '0%': { backgroundPosition: '0% 0%' }, '100%': { backgroundPosition: '100% 100%' } },
              orbit: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
              'orbit-reverse': { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
              breathe: { '0%, 100%': { transform: 'scale(1)', opacity: '0.8' }, '50%': { transform: 'scale(1.1)', opacity: '0.4' } },
            },
            padding: {
              'safe': 'env(safe-area-inset-bottom)',
            }
          },
        }
      }
    </script>

    <style>
      /* --- SEMANTIC THEME VARIABLES --- */
      :root {
        /* Default: Deep Space (OLED) */
        --bg-core: #050505;
        --bg-panel: rgba(20, 20, 20, 0.4);
        --border-main: rgba(255, 255, 255, 0.08);
        --text-primary: #e8eaed;
        --text-secondary: #9ca3af;
        --accent-main: #f59e0b; /* Amber */
        --accent-dim: rgba(245, 158, 11, 0.2);
        --noise-opacity: 0.04;
      }

      body { background-color: var(--bg-core); color: var(--text-primary); font-family: 'Inter', sans-serif; margin: 0; transition: background-color 0.5s ease, color 0.5s ease; }
      
      .bg-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; opacity: var(--noise-opacity); background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
      
      .glass-panel { background: var(--bg-panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border-main); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); will-change: backdrop-filter; transition: background 0.5s ease, border 0.5s ease; }
      
      .text-shimmer { background: linear-gradient(to right, var(--text-secondary) 20%, var(--text-primary) 50%, var(--text-secondary) 80%); background-size: 200% auto; color: transparent; background-clip: text; -webkit-background-clip: text; animation: shimmer 4s linear infinite; }
      
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-main); }
      
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      #preloader-core { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
      .loader-spinner { width: 50px; height: 50px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      .prose p { margin-bottom: 0.75em; color: var(--text-primary); }
      .prose strong { font-weight: 700; color: var(--accent-main); }
      .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; color: var(--text-secondary); }
      
      /* --- PRINT STYLES (PDF EXPORT FIX) --- */
      @media print {
        body { background-color: white !important; color: black !important; }
        .bg-noise, nav, .glass-panel, .fixed, .no-print, button, .hidden-print { display: none !important; }
        #root { display: none !important; } 
        
        #printable-content {
           display: block !important;
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: auto;
           background: white !important;
           color: black !important;
           z-index: 9999;
           padding: 20px;
           visibility: visible;
        }
        #printable-content * { visibility: visible; color: black !important; }
        @page { size: auto; margin: 15mm; }
      }
    </style>
