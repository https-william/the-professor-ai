  <script>
    // Global Polyfills
    if (typeof process === 'undefined') { window.process = { env: {} }; }
    if (typeof global === 'undefined') { window.global = window; }

    // PDF Worker Handled in Services


    // GLOBAL ERROR BOUNDARY - Prevents Black Screen of Death
    // LIFE SUPPORT SYSTEM (PROTOCOL 9)
    // Catches errors before React mounts and shows a "System Failure" modal.
    window.onerror = function (msg, url, line, col, error) {
      console.error("Global Error Caught:", msg, error);
      const errorRoot = document.getElementById('error-root');
      if (errorRoot) {
        errorRoot.style.display = 'flex';
        errorRoot.innerHTML = `
            <div style="text-align: center; padding: 2rem; max-width: 400px; border: 1px solid rgba(239, 68, 68, 0.3); background: #050505; border-radius: 1rem; color: #ef4444; font-family: monospace; box-shadow: 0 0 50px rgba(220, 38, 38, 0.1);">
              <h2 style="font-weight: 900; margin-bottom: 1rem; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 0.1em;">System Critical Failure</h2>
              <p style="color: #9ca3af; font-size: 0.8rem; margin-bottom: 2rem; line-height: 1.6;">${msg}</p>
              <button onclick="window.location.reload()" style="background: #ef4444; color: white; padding: 0.75rem 2rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; transition: all 0.2s;">Reboot System</button>
            </div>
          `;

        // Kill preloader if it exists
        const preloader = document.getElementById('preloader-core');
        if (preloader) preloader.remove();
      }
    };

    window.onunhandledrejection = function (event) {
      window.onerror(event.reason ? event.reason.message : 'Unhandled Promise Rejection', null, null, null, event.reason);
    };

    window.addEventListener('load', function () {

      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
      }

      // SAFE PRELOADER REMOVAL
      const checkMount = setInterval(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          const preloader = document.getElementById('preloader-core');
          if (preloader) {
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';
            setTimeout(() => preloader.remove(), 500);
          }
          clearInterval(checkMount);
        }
      }, 100);

      // PRELOADER TIMEOUT (PROTOCOL 9)
      // If React fails to mount within 8 seconds, force manual recovery.
      setTimeout(() => {
        const preloader = document.getElementById('preloader-core');
        if (preloader && document.getElementById('root').childElementCount === 0) {
          console.warn("React mount timed out - Preloader still active.");
          preloader.innerHTML = `
            <div style="text-align: center; padding: 2rem; max-width: 400px; color: #fff; font-family: sans-serif;">
              <h2 style="font-weight: bold; margin-bottom: 0.5rem;">Connection Timeout</h2>
              <p style="color: #9ca3af; font-size: 0.9rem; margin-bottom: 1.5rem;">The application is taking longer than usual to load.</p>
              <button onclick="window.location.reload()" style="background: white; color: black; padding: 0.75rem 1.5rem; border: none; border-radius: 2rem; font-weight: bold; cursor: pointer;">Reload</button>
            </div>
          `;
        }
      }, 8000);
    });

    // Tailwind Config
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'core': 'var(--bg-core)',
            'panel': 'var(--bg-panel)',
            'border-main': 'var(--border-main)',
            'text-pri': 'var(--text-pri)',
            'text-sec': 'var(--text-sec)',

            serif: ['Cinzel', 'Merriweather', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Cinzel', 'serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out',
            'slide-in': 'slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'liquid-blob': 'liquidBlob 20s infinite alternate',
            'mesh-drift': 'meshDrift 20s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideIn: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },

              '100%': { transform: 'translate(-20px, -20px) rotate(2deg)' }
            }
          },
        },
      }
    }

    .bg-noise {

      transition: opacity 0.5s ease;
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px) saturate(180%);

      border: 1px solid var(--border-main);
      box-shadow: var(--glass-shadow);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* 3D Glass Button - Cluely Style */
    .btn-glass {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 4px 10px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: white;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-glass:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 8px 20px rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-glass:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.2),
        0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .oracle-glow {
      box-shadow: 0 0 10px #ef4444, inset 0 0 20px #7f1d1d;
      animation: pulse-glow 3s infinite;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 10px #ef4444, inset 0 0 10px #7f1d1d;
      }

      50% {
        box-shadow: 0 0 25px #ef4444, inset 0 0 30px #ef4444;
      }
    }

    #preloader-core {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-core);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 2px solid var(--border-main);
      border-top-color: var(--accent-solid);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

  <!-- iOS 26 Liquid Glass SVG Filters -->
  <svg class="glass-filters" style="position:absolute;width:0;height:0;pointer-events:none;">
    <defs>
      <!-- Lens Distortion Filter -->
      <filter id="lensFilter" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur" />
        <feColorMatrix type="saturate" values="1.2" in="blur" result="saturated" />
      </filter>

      <!-- Liquid Glass Displacement Filter -->
      <filter id="liquid-glass" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="noise" seed="5" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>

      <!-- Fresnel Reflection Filter -->
      <filter id="fresnel" x="0%" y="0%" width="100%" height="100%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
        <feOffset in="blur" dx="0" dy="1" result="offsetBlur" />
        <feComposite in="SourceGraphic" in2="offsetBlur" operator="over" />
      </filter>

      <!-- Glass Specular Highlight -->
      <filter id="glass-specular" x="0%" y="0%" width="100%" height="100%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
        <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.75" specularExponent="20"
          lighting-color="#fff" result="specular">
          <fePointLight x="-5000" y="-10000" z="20000" />
        </feSpecularLighting>
        <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
      </filter>
    </defs>
  </svg>
