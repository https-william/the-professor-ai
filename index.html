
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PRIMARY SEO -->
    <title>The Professor | AI Study Tool & Exam Generator</title>
    <meta name="description" content="The #1 AI Study Companion. Turn lecture notes into exams, quizzes, and flashcards instantly. Study smarter, not harder." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo-pwa.svg">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />

    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    
    <!-- Google APIs (For Drive Picker) -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client.js"></script>

    <!-- PDF & Math Libs -->
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script>
      // Global Polyfills
      if (typeof process === 'undefined') { window.process = { env: {} }; }
      if (typeof global === 'undefined') { window.global = window; }
      
      // PDF Worker
      const PDF_WORKER_SRC = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      
      window.addEventListener('load', function() {
         // SAFETY TIMEOUT: If React doesn't hydrate within 5 seconds, remove the loader
         setTimeout(() => {
             const preloader = document.getElementById('preloader-core');
             if(preloader) {
                preloader.style.opacity = '0';
                preloader.style.pointerEvents = 'none';
                setTimeout(() => preloader.remove(), 500);
             }
         }, 5000);
         
         if (typeof pdfjsLib !== 'undefined') {
             pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
         }
         if (typeof mermaid !== 'undefined') {
             mermaid.initialize({ startOnLoad: false, theme: 'dark' });
         }
      });

      // Tailwind Config
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'core': 'var(--bg-core)',
              'panel': 'var(--bg-panel)',
              'border-main': 'var(--border-main)',
              'text-pri': 'var(--text-pri)',
              'text-sec': 'var(--text-sec)',
              'accent': 'var(--accent-solid)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Cinzel', 'Merriweather', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Cinzel', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-in': 'slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'orbit': 'orbit 3s linear infinite',
              'orbit-reverse': 'orbit-reverse 4s linear infinite',
              'breathe': 'breathe 3s ease-in-out infinite',
              'liquid-blob': 'liquidBlob 20s infinite alternate',
              'mesh-drift': 'meshDrift 20s ease-in-out infinite alternate',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
              slideUpFade: { '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
              shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
              orbit: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
              'orbit-reverse': { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
              breathe: { '0%, 100%': { transform: 'scale(1)', opacity: '0.8' }, '50%': { transform: 'scale(1.1)', opacity: '0.4' } },
              liquidBlob: {
                '0%': { transform: 'translate(0, 0) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0, 0) scale(1)' }
              },
              meshDrift: {
                '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                '100%': { transform: 'translate(-20px, -20px) rotate(2deg)' }
              }
            },
          },
        }
      }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      /* SEMANTIC VARIABLES */
      :root {
        /* Light Mode: "Cluely" Aesthetic - Soft, Airy, Modern */
        --bg-core: #F8FAFC; 
        --bg-panel: rgba(255, 255, 255, 0.6); /* Highly transparent frost */
        --border-main: rgba(226, 232, 240, 0.6); /* Very subtle border */
        --text-pri: #0F172A; /* Slate 900 */
        --text-sec: #64748B; /* Slate 500 */
        --accent-solid: #3B82F6; /* Vibrant Blue */
        --noise-opacity: 0.015; /* Barely visible texture */
      }

      .dark {
        /* Dark Mode: "Deep Space" - High Contrast, Neon */
        --bg-core: #030712; 
        --bg-panel: rgba(17, 24, 39, 0.7); 
        --border-main: rgba(255, 255, 255, 0.08);
        --text-pri: #F8FAFC; 
        --text-sec: #94A3B8; 
        --accent-solid: #3B82F6;
        --noise-opacity: 0.05;
      }

      body { 
        background-color: var(--bg-core); 
        color: var(--text-pri); 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .bg-noise { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; 
        opacity: var(--noise-opacity); 
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); 
        transition: opacity 0.5s ease;
      }
      
      /* New macOS Style Glass */
      .glass-panel { 
        background: var(--bg-panel); 
        backdrop-filter: blur(20px) saturate(180%); 
        -webkit-backdrop-filter: blur(20px) saturate(180%); 
        border: 1px solid var(--border-main); 
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      /* LIQUID BUTTON - "Cluely" Style */
      .btn-liquid {
        background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
        color: white;
        box-shadow: 
          0 4px 15px rgba(37, 99, 235, 0.4), /* Colored drop shadow */
          inset 0 1px 0 rgba(255, 255, 255, 0.3), /* Top highlight */
          inset 0 -1px 0 rgba(0, 0, 0, 0.1); /* Bottom subtle shade */
        border: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .btn-liquid:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #4F93F7 0%, #306FEA 100%);
        box-shadow: 
          0 8px 25px rgba(37, 99, 235, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      
      .btn-liquid:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
      }

      #preloader-core { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-core); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; 
      }
      
      .loader-spinner { 
        width: 50px; height: 50px; border: 2px solid var(--border-main); border-top-color: var(--accent-solid); border-radius: 50%; animation: spin 1s linear infinite; 
      }
      
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- ES Module Shims -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.12.0",

    "dompurify": "https://esm.sh/dompurify@3.0.9",
    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="bg-noise"></div>
    <div id="root">
      <div id="preloader-core">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <div id="printable-content" style="display: none;"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
