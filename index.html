  <script>
    // Global Polyfills
    if (typeof process === 'undefined') { window.process = { env: {} }; }
    if (typeof global === 'undefined') { window.global = window; }

    // PDF Worker Handled in Services


    // GLOBAL ERROR BOUNDARY - Prevents Black Screen of Death
    window.onerror = function (msg, url, line, col, error) {
      console.error("Global Error Caught:", msg, error);
      const preloader = document.getElementById('preloader-core');
      if (preloader) {
        preloader.innerHTML = `
            <div style="text-align: center; padding: 2rem; max-width: 400px; border: 1px solid rgba(220, 38, 38, 0.5); background: #050505; border-radius: 1rem; color: #ef4444; font-family: monospace;">
              <h2 style="font-weight: bold; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 1.2rem;">System Critical Failure</h2>
              <p style="color: #9ca3af; font-size: 0.8rem; margin-bottom: 1.5rem; line-height: 1.4;">${msg}</p>
              <button onclick="window.location.reload()" style="background: #ef4444; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em;">Reboot System</button>
            </div>
          `;
        preloader.style.opacity = '1';
        preloader.style.pointerEvents = 'auto';
        preloader.style.zIndex = '99999';
      }
    };

    window.addEventListener('load', function () {

      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
      }

      // SAFE PRELOADER REMOVAL
      const checkMount = setInterval(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount > 0) {
          const preloader = document.getElementById('preloader-core');
          if (preloader) {
            preloader.style.opacity = '0';
            preloader.style.pointerEvents = 'none';
            setTimeout(() => preloader.remove(), 500);
          }
          clearInterval(checkMount);
        }
      }, 100);

      setTimeout(() => {
        if (document.getElementById('preloader-core')) {
          console.warn("React mount timed out - Preloader still active.");
          clearInterval(checkMount);
        }
      }, 8000);
    });

    // Tailwind Config
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'core': 'var(--bg-core)',
            'panel': 'var(--bg-panel)',
            'border-main': 'var(--border-main)',
            'text-pri': 'var(--text-pri)',
            'text-sec': 'var(--text-sec)',
            'accent': 'var(--accent-solid)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Cinzel', 'Merriweather', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['Cinzel', 'serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out',
            'slide-in': 'slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'liquid-blob': 'liquidBlob 20s infinite alternate',
            'mesh-drift': 'meshDrift 20s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideIn: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
            slideUpFade: { '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
            shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
            liquidBlob: {
              '0%': { transform: 'translate(0, 0) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0, 0) scale(1)' }
            },
            meshDrift: {
              '0%': { transform: 'translate(0, 0) rotate(0deg)' },
              '100%': { transform: 'translate(-20px, -20px) rotate(2deg)' }
            }
          },
        },
      }
    }
  </script>

  <style>
    /* SEMANTIC VARIABLES */
    :root {
      /* Light Mode */
      --bg-core: #F9F9F7;
      --bg-panel: rgba(255, 255, 255, 0.75);
      --border-main: rgba(0, 0, 0, 0.06);
      --text-pri: #1C1C1C;
      --text-sec: #575757;
      --accent-solid: #2563EB;
      --noise-opacity: 0.03;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
    }

    .dark {
      /* Dark Mode */
      --bg-core: #050505;
      --bg-panel: rgba(10, 10, 12, 0.65);
      --border-main: rgba(255, 255, 255, 0.08);
      --text-pri: #EDEDED;
      --text-sec: #888888;
      --accent-solid: #3B82F6;
      --noise-opacity: 0.05;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* Scroll Lock Logic */
    html,
    body {
      height: 100%;
      overflow: hidden;
      /* Prevent native scroll bounce */
    }

    body {
      background-color: var(--bg-core);
      color: var(--text-pri);
      font-family: 'Inter', sans-serif;
      margin: 0;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #root {
      height: 100%;
      overflow-y: auto;
      /* Handle scrolling within the app container */
      -webkit-overflow-scrolling: touch;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }

    .bg-noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      transition: opacity 0.5s ease;
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-main);
      box-shadow: var(--glass-shadow);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* 3D Glass Button - Cluely Style */
    .btn-glass {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 4px 10px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: white;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-glass:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 8px 20px rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-glass:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.2),
        0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .oracle-glow {
      box-shadow: 0 0 10px #ef4444, inset 0 0 20px #7f1d1d;
      animation: pulse-glow 3s infinite;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 10px #ef4444, inset 0 0 10px #7f1d1d;
      }

      50% {
        box-shadow: 0 0 25px #ef4444, inset 0 0 30px #ef4444;
      }
    }

    #preloader-core {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-core);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 2px solid var(--border-main);
      border-top-color: var(--accent-solid);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
