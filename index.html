
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PRIMARY SEO -->
    <title>The Professor | AI Study Tool</title>
    <meta name="description" content="AI-powered academic accelerator. Transform materials into mastery." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo-pwa.svg">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />

    <!-- Tailwind Config - MUST BE LOADED BEFORE TAILWIND SCRIPT -->
    <script>
      // Global Polyfills
      if (typeof process === 'undefined') { window.process = { env: {} }; }
      if (typeof global === 'undefined') { window.global = window; }
      
      const PDF_WORKER_SRC = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      
      window.addEventListener('load', function() {
         const preloader = document.getElementById('preloader-core');
         if(preloader) {
            setTimeout(() => {
               preloader.style.opacity = '0';
               preloader.style.pointerEvents = 'none';
               setTimeout(() => preloader.remove(), 500);
            }, 500); 
         }
         if (typeof pdfjsLib !== 'undefined') {
             pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
         }
         if (typeof mermaid !== 'undefined') {
             mermaid.initialize({ startOnLoad: false, theme: 'dark' });
         }
      });

      tailwind = {
        darkMode: 'class',
        config: {
          theme: {
            extend: {
              colors: {
                'core': '#050505',
                'panel': 'rgba(24, 24, 27, 0.6)',
                'border-main': 'rgba(255, 255, 255, 0.08)',
                'text-pri': '#f3f4f6',
                'text-sec': '#9ca3af',
                'accent': '#f59e0b',
              },
              fontFamily: {
                sans: ['Inter', 'system-ui', 'sans-serif'],
                serif: ['Cinzel', 'Merriweather', 'serif'],
                mono: ['JetBrains Mono', 'monospace'],
                display: ['Cinzel', 'serif'],
              },
              animation: {
                'fade-in': 'fadeIn 0.4s ease-out forwards',
                'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                'slide-in': 'slideIn 0.6s ease-out forwards',
                'slide-up-fade': 'slideUpFade 0.6s ease-out forwards',
                'pulse-slow': 'pulseSlow 4s infinite',
                'shimmer': 'shimmer 2s linear infinite',
                'orbit': 'orbit 10s linear infinite',
                'orbit-reverse': 'orbitReverse 15s linear infinite',
                'breathe': 'breathe 4s ease-in-out infinite',
                'bounce-subtle': 'bounceSubtle 2s infinite',
              },
              keyframes: {
                fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                slideIn: { '0%': { opacity: '0', transform: 'translateY(-20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                slideUpFade: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                pulseSlow: { '0%, 100%': { opacity: '0.4' }, '50%': { opacity: '0.7' } },
                shimmer: { '0%': { backgroundPosition: '200% 0' }, '100%': { backgroundPosition: '-200% 0' } },
                orbit: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                orbitReverse: { '0%': { transform: 'rotate(360deg)' }, '100%': { transform: 'rotate(0deg)' } },
                breathe: { '0%, 100%': { transform: 'scale(1)', opacity: '0.3' }, '50%': { transform: 'scale(1.1)', opacity: '0.6' } },
                bounceSubtle: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } },
              },
            },
          }
        }
      }
    </script>

    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Payments -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    
    <!-- PDF & Math Libs -->
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      body { background-color: #050505; color: #f3f4f6; font-family: 'Inter', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
      .bg-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
      #preloader-core { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
      .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
      
      /* Utilities */
      .glass-panel { background: rgba(20, 20, 22, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- ES Module Shims -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?deps=react@18.2.0,react-dom@18.2.0",
    "@google/genai": "https://esm.sh/@google/genai@0.12.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "dompurify": "https://esm.sh/dompurify@3.0.9"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="bg-noise"></div>
    <div id="root">
      <div id="preloader-core">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
