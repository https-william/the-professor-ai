
<!DOCTYPE html>
<html lang="en" class="dark" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PRIMARY SEO -->
    <title>The Professor | AI Study Tool & Exam Generator</title>
    <meta name="description" content="The #1 AI Study Companion. Turn lecture notes into exams, quizzes, and flashcards instantly. Study smarter, not harder." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo-pwa.svg">
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />

    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    
    <!-- Google APIs -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client.js"></script>

    <!-- PDF & Math Libs -->
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <script>
      // Global Polyfills
      if (typeof process === 'undefined') { window.process = { env: {} }; }
      if (typeof global === 'undefined') { window.global = window; }
      
      // PDF Worker
      const PDF_WORKER_SRC = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      
      // GLOBAL ERROR BOUNDARY - Prevents Black Screen of Death
      window.onerror = function(msg, url, line, col, error) {
        console.error("Global Error Caught:", msg, error);
        const preloader = document.getElementById('preloader-core');
        if (preloader) {
          preloader.innerHTML = `
            <div style="text-align: center; padding: 2rem; max-width: 400px; border: 1px solid rgba(220, 38, 38, 0.5); background: #050505; border-radius: 1rem; color: #ef4444; font-family: monospace;">
              <h2 style="font-weight: bold; margin-bottom: 0.5rem; text-transform: uppercase; font-size: 1.2rem;">System Critical Failure</h2>
              <p style="color: #9ca3af; font-size: 0.8rem; margin-bottom: 1.5rem; line-height: 1.4;">${msg}</p>
              <button onclick="window.location.reload()" style="background: #ef4444; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em;">Reboot System</button>
            </div>
          `;
          preloader.style.opacity = '1';
          preloader.style.pointerEvents = 'auto';
          preloader.style.zIndex = '99999';
        }
      };

      window.addEventListener('load', function() {
         if (typeof pdfjsLib !== 'undefined') {
             pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
         }
         if (typeof mermaid !== 'undefined') {
             mermaid.initialize({ startOnLoad: false, theme: 'dark' });
         }

         // SAFE PRELOADER REMOVAL
         // Only remove the loading screen if React has actually mounted something into #root
         const checkMount = setInterval(() => {
             const root = document.getElementById('root');
             // Check if root has children (React has mounted)
             if (root && root.childElementCount > 0) {
                 const preloader = document.getElementById('preloader-core');
                 if (preloader) {
                     preloader.style.opacity = '0';
                     preloader.style.pointerEvents = 'none';
                     setTimeout(() => preloader.remove(), 500);
                 }
                 clearInterval(checkMount);
             }
         }, 100);

         // Failsafe: If nothing happens in 8 seconds, log warning but don't force remove (keeps error visible if any)
         setTimeout(() => {
             if (document.getElementById('preloader-core')) {
                 console.warn("React mount timed out - Preloader still active.");
                 clearInterval(checkMount);
             }
         }, 8000);
      });

      // Tailwind Config
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'core': 'var(--bg-core)',
              'panel': 'var(--bg-panel)',
              'border-main': 'var(--border-main)',
              'text-pri': 'var(--text-pri)',
              'text-sec': 'var(--text-sec)',
              'accent': 'var(--accent-solid)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Cinzel', 'Merriweather', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Cinzel', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-in': 'slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up-fade': 'slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'liquid-blob': 'liquidBlob 20s infinite alternate',
              'mesh-drift': 'meshDrift 20s ease-in-out infinite alternate',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateX(30px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
              slideUpFade: { '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
              shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
              liquidBlob: {
                '0%': { transform: 'translate(0, 0) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0, 0) scale(1)' }
              },
              meshDrift: {
                '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                '100%': { transform: 'translate(-20px, -20px) rotate(2deg)' }
              }
            },
          },
        }
      }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      /* SEMANTIC VARIABLES */
      :root {
        /* Light Mode */
        --bg-core: #F9F9F7; 
        --bg-panel: rgba(255, 255, 255, 0.75);
        --border-main: rgba(0, 0, 0, 0.06); 
        --text-pri: #1C1C1C; 
        --text-sec: #575757; 
        --accent-solid: #2563EB; 
        --noise-opacity: 0.03; 
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
      }

      .dark {
        /* Dark Mode */
        --bg-core: #050505; 
        --bg-panel: rgba(10, 10, 12, 0.65); 
        --border-main: rgba(255, 255, 255, 0.08);
        --text-pri: #EDEDED; 
        --text-sec: #888888; 
        --accent-solid: #3B82F6;
        --noise-opacity: 0.05;
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      body { 
        background-color: var(--bg-core); 
        color: var(--text-pri); 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-x: hidden;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }

      .bg-noise { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; 
        opacity: var(--noise-opacity); 
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); 
        transition: opacity 0.5s ease;
      }
      
      .glass-panel { 
        background: var(--bg-panel); 
        backdrop-filter: blur(16px) saturate(180%); 
        -webkit-backdrop-filter: blur(16px) saturate(180%); 
        border: 1px solid var(--border-main); 
        box-shadow: var(--glass-shadow);
        transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .btn-depth {
        background: var(--text-pri);
        border: 1px solid var(--border-main);
        color: var(--bg-core);
        box-shadow: 0 4px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1); 
        transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .dark .btn-depth {
        background: #111;
        color: white;
        box-shadow: 0 4px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .btn-depth:hover { transform: translateY(-2px); filter: brightness(1.1); }
      .dark .btn-depth:hover { box-shadow: 0 6px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
      .btn-depth:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.2), inset 0 2px 5px rgba(0,0,0,0.1); }
      .dark .btn-depth:active { box-shadow: 0 0 0 rgba(0,0,0,0.5), inset 0 2px 5px rgba(0,0,0,0.3); }
      
      .btn-depth-blue {
        background: #2563EB;
        color: white;
        border-color: #3B82F6;
        box-shadow: 0 4px 0 #1e40af, inset 0 1px 0 rgba(255,255,255,0.3);
      }
      .btn-depth-blue:hover { box-shadow: 0 6px 0 #1e40af, inset 0 1px 0 rgba(255,255,255,0.4); }
      .btn-depth-blue:active { box-shadow: 0 0 0 #1e40af, inset 0 2px 5px rgba(0,0,0,0.3); }

      .oracle-glow {
        box-shadow: 0 0 10px #ef4444, inset 0 0 20px #7f1d1d;
        animation: pulse-glow 3s infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 10px #ef4444, inset 0 0 10px #7f1d1d; }
        50% { box-shadow: 0 0 25px #ef4444, inset 0 0 30px #ef4444; }
      }

      #preloader-core { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-core); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; 
      }
      
      .loader-spinner { 
        width: 50px; height: 50px; border: 2px solid var(--border-main); border-top-color: var(--accent-solid); border-radius: 50%; animation: spin 1s linear infinite; 
      }
      
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- ES Module Shims -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

</script>

    <div class="bg-noise"></div>
    <div id="root"></div>
    <div id="preloader-core">
      <div class="loader-spinner"></div>
    </div>
    <div id="printable-content" style="display: none;"></div>
