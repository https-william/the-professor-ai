
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Solid Background for PWA Masking Safety -->
  <rect width="512" height="512" fill="#050505" />
  
  <!-- Content Scaled Down to 65% to fit Safe Zone -->
  <g transform="translate(102.4, 102.4) scale(0.6)">
      <!-- Graduation Cap Top (Diamond) -->
      <path d="M75 225 L250 125 L425 225 L250 325 Z" fill="url(#grad)" stroke="#ffffff" stroke-width="12"/>
      <!-- Tassel String -->
      <path d="M425 225 V350" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
      <!-- Tassel Ball -->
      <circle cx="425" cy="375" r="30" fill="#f59e0b"/>
      <!-- Cap Base -->
      <path d="M150 275 V375 C150 425 350 425 350 375 V275" fill="none" stroke="white" stroke-width="12"/>
      <!-- Center Button -->
      <circle cx="250" cy="225" r="30" fill="#fff"/>
  </g>
</svg>
