[package]
name = "the-professor"
version = "0.1.0"
description = "The Professor - AI Study Companion"
authors = ["The Professor Academy"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-deep-link = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# default enables core tauri features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
