
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none">
  <!-- 1. The Mortarboard -->
  <path 
    d="M50 20 L90 45 L50 70 L10 45 Z" 
    stroke="#2563EB" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- 2. The Neural Core (Electric Blue Fill) -->
  <path 
    d="M50 35 L60 40 L60 50 L50 55 L40 50 L40 40 Z" 
    fill="#2563EB" 
    fill-opacity="0.9"
  />
  
  <!-- 3. The Cap Base -->
  <path 
    d="M25 55 V75 C25 85 75 85 75 75 V55" 
    stroke="#0F172A" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-opacity="0.8"
  />
  
  <!-- 4. The Neural Tassel -->
  <path 
    d="M50 45 C70 45 80 55 85 75" 
    stroke="#3B82F6" 
    stroke-width="2" 
    stroke-dasharray="4 2"
  />
  <circle cx="85" cy="75" r="5" fill="#3B82F6" />
</svg>
