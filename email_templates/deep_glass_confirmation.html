
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Reset */
    body { background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #ffffff; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    
    /* Layout */
    .wrapper { width: 100%; background-color: #000000; padding: 40px 0; }
    .container { 
        max-width: 480px; 
        margin: 0 auto; 
        background-color: #050505; 
        border: 1px solid #1a1a1a; 
        border-radius: 24px; 
        overflow: hidden; 
        box-shadow: 0 0 80px rgba(59, 130, 246, 0.1); 
    }
    
    /* Elements */
    .header { 
        padding: 30px; 
        text-align: center; 
        border-bottom: 1px solid #111; 
        background: radial-gradient(circle at top, #111 0%, #050505 100%);
    }
    .content { padding: 40px 30px; text-align: center; }
    
    /* Typography */
    .logo { font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; color: #fff; letter-spacing: 4px; text-transform: uppercase; }
    .accent { color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    .h1 { font-size: 14px; font-weight: 700; margin-bottom: 15px; color: #3b82f6; text-transform: uppercase; letter-spacing: 2px; }
    .text { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 30px; font-weight: 300; }
    
    /* The Code Module */
    .code-box { 
        background-color: #0a0a0c; 
        border: 1px solid #222; 
        border-radius: 16px; 
        padding: 30px 20px; 
        margin: 30px 0; 
        position: relative; 
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .code { 
        font-family: 'Courier New', Courier, monospace; 
        font-size: 32px; 
        letter-spacing: 8px; 
        font-weight: bold; 
        color: #fff; 
        display: block; 
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
        position: relative;
        z-index: 2;
    }
    .code-label { display: block; font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
    
    /* Decorations */
    .scan-line { height: 1px; width: 80%; margin: 0 auto 15px auto; background: linear-gradient(90deg, transparent, #3b82f6, transparent); opacity: 0.5; }
    
    /* Button */
    .btn { 
        display: inline-block; 
        background-color: #ffffff; 
        color: #000000; 
        font-weight: 800; 
        text-decoration: none; 
        padding: 16px 32px; 
        border-radius: 50px; 
        font-size: 11px; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        transition: 0.3s; 
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.15); 
    }
    
    /* Footer */
    .footer { 
        padding: 25px; 
        text-align: center; 
        font-size: 9px; 
        color: #333; 
        border-top: 1px solid #111; 
        background-color: #020202; 
        font-family: 'Courier New', Courier, monospace; 
        letter-spacing: 1px; 
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <div class="logo">The <span class="accent">Professor</span></div>
      </div>
      <div class="content">
        <div class="h1">Authentication Request</div>
        <p class="text">
         Use the secure token below to verify your Login.
        </p>
        
        <div class="code-box">
          <span class="code-label">Secure Verification Token</span>
          <div class="scan-line"></div>
          <span class="code">{{ .Token }}</span>
        </div>
        
        <a href="{{ .ConfirmationURL }}" class="btn">Confirm Identity</a>
        
        <p class="text" style="margin-top: 30px; font-size: 10px; color: #444;">
          If you did not initiate this session, please disregard this transmission.
        </p>
      </div>
      <div class="footer">
        SECURE TRANSMISSION // VEXIS AUTOMATIONS<br>
        ID: {{ .Email }}
      </div>
    </div>
  </div>
</body>
</html>
